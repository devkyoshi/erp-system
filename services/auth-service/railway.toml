[build]
builder = "NIXPACKS"
buildCommand = "cd /app && go mod download && cd /app/services/auth-service && CGO_ENABLED=0 GOOS=linux go build -o auth-service ./cmd/main.go"

[deploy]
startCommand = "./auth-service"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
